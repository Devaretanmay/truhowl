[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "truhowl"
version = "1.2.0"
description = "Autonomous SDK/API migration worker that repairs breaking upgrades and proves the migration works before opening a PR."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["sdk-migration", "api-migration", "breaking-changes", "developer-tools", "sandbox", "code-repair"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "blake3>=1.0",
    "pyyaml>=6.0",
    "pyjwt[crypto]>=2.8.0",
]

[project.scripts]
truhowl = "truhowl.cli.main:cli"
# Deprecated transitional alias. Remove after Phase 1.
koyote = "truhowl.cli.main:cli"

[project.urls]
Homepage = "https://github.com/Devaretanmay/truhowl"
Repository = "https://github.com/Devaretanmay/truhowl"
Issues = "https://github.com/Devaretanmay/truhowl/issues"

[tool.maturin]
features = ["pyo3-binding"]
python-source = "python"
module-name = "truhowl._core"

[tool.pytest.ini_options]
# Tests import the installed truhowl package, not the source tree.
# (The source tree intentionally contains no compiled _core.*.so; the native
# module ships inside the wheel, so importing source here would silently lose
# the sandbox/compression core.)
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]
