[package]
name = "truhowl-core"
version = "1.1.3"
edition = "2021"
license = "Apache-2.0"
description = "Truhowl - autonomous SDK/API migration worker (Rust core)"
repository = "https://github.com/Devaretanmay/truhowl"
homepage = "https://github.com/Devaretanmay/truhowl"
documentation = "https://docs.rs/crate/truhowl-core"
keywords = ["sdk-migration", "api-migration", "compression", "execution", "sandbox"]
categories = ["development-tools", "command-line-utilities"]

[lib]
name = "truhowl_core"
crate-type = ["cdylib", "lib"]

[features]
default = []
# Python extension module (enabled by maturin). Plain `cargo build`
# without this feature produces a clean FFI cdylib for the TS SDK.
pyo3-binding = ["dep:pyo3", "pyo3/extension-module", "pyo3/abi3-py38"]

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py38"], optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150" }
regex = "1"
flate2 = "1"
aho-corasick = "1"
blake3 = "1"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"
